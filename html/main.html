<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ヌメロン</title>
		<link rel="stylesheet" href="../css/style.css">
	</head>
	<body>
		<header>
		</header>
		<main>
			<input type="number" id="userInput" min="1000" max="9999" placeholder="数字を入力してください">
			<input type="button" id="clickButton" value="入力">
			<p id="errorMessage"></p>
			<section id="firstResult">
				<h2>結果</h2>
				<p id="incorrect"></p>
				<p id="correct"></p>
			</section>
			<section>
				<h2>履歴</h2>
				<ul id="history">
				</ul>
			</section>
		</main>
		<aside id="aside">
			<section id="rule">
				<h2>ルール</h2>
				<p>4桁の数字を当てるゲームです。</p>
				<p>ヒット: 数字と位置が一致</p>
				<p>ブロー: 数字は一致するが位置が違う</p>
				<p>解答に0が2つある場合は，0を一つ入力すると1ブローと表示されます</p>
				<p>千の位は0以外の数字です</p>
			</section>
			<section>
				<h2 id="answer">
				</h2>
				<input type="button" id="showAnswer" value="正解を表示">
			</section>
			<section>
				<h2 id="nextQuestion"></h2>
				<input type="button" id="nextButton" value="次の問題を表示">
			</section>
		</aside>

		<footer>
		</footer>
		<script type="module" src="../javascript/main.js"></script>
	</body>
</html>
